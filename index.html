<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gulf Way | WPS Dashboard</title>
  
  <!-- CSS Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gw: {
              bg: '#f8fafc',
              panel: '#f1f5f9',
              card: '#ffffff',
              line: '#e2e8f0',
              text: '#0f172a',
              muted: '#64748b',
              teal: '#0d9488',
              teal2: '#115e59',
              blue: '#2563eb',
              danger: '#dc2626',
              ok: '#059669',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #f8fafc; color: #0f172a; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; border: 1px solid #ffffff; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .recharts-default-legend { font-weight: 900 !important; text-transform: uppercase !important; font-size: 10px !important; }
    .animate-in { animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <!-- JS Libraries -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "xlsx": "https://esm.sh/xlsx@^0.18.5"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const { 
      PieChart, Pie, Cell, Tooltip, ResponsiveContainer, Legend 
    } = Recharts;

    /** --- TYPES & CONSTANTS --- **/
    const REMARK_MAP = {
      "1": "Outside the Country as per salary date",
      "2": "Employees on Probation",
      "3": "PreApproval WorkPermit",
      "4": "Temporary WorkPermit",
      "9": "Cancelled Employees / Under Cancellation Employees",
      "10": "Employees exempted from Exemption Service",
      "11": "Absconding Employees",
      "12": "Employees having Complaint move to court",
      "13": "Unpaid Leave",
      "14": "NEW GT ELECTRONIC WORK PERMIT"
    };
    const REMARK_MASTER = Object.values(REMARK_MAP);
    const OTHER_REMARK_KEY = "Other / Unmatched";

    /** --- UTILS & SERVICES --- **/
    const parseNum = (v) => {
      if (typeof v === 'number') return v;
      if (!v) return 0;
      const n = parseFloat(String(v).replace(/,/g, '').replace(/[^\d.-]/g, ''));
      return isNaN(n) ? 0 : n;
    };

    const cleanEnglishName = (v) => {
      if (!v) return "";
      return String(v).replace(/[^A-Za-z \.]+/g, " ").replace(/\s+/g, " ").trim();
    };

    const normalizeRemark = (v) => {
      if (!v) return "";
      let s = String(v).trim();
      const codeMatch = s.match(/^(\d+)/);
      if (codeMatch) {
        const code = String(parseInt(codeMatch[1], 10));
        if (REMARK_MAP[code]) return REMARK_MAP[code];
      }
      return s.replace(/^\s*\d+\s*[\.\)\:\-]\s*/g, "").trim();
    };

    /** --- COMPONENTS --- **/

    // 1. Sidebar Component
    const Sidebar = ({ onFileUpload, isProcessing, sheetNames, currentSheet, onSheetChange, onDownloadFull, onDownloadPaid, onDownloadDue, fileName, kpis }) => {
      const [showControls, setShowControls] = useState(true);
      const fileInputRef = useRef(null);

      const SummaryCard = ({ label, val, colorClass = "text-gw-text", borderColor = "border-gw-line" }) => (
        <div className={`flex justify-between items-center p-2 mb-2 bg-white border-l-4 ${borderColor} border-y border-r border-gw-line rounded-r-lg shadow-sm hover:shadow-md transition-all group`}>
          <div className="bg-gw-text text-white px-2 py-1 rounded shadow-sm border border-gw-text">
             <span className="text-[10px] font-black uppercase tracking-tight">{label}</span>
          </div>
          <span className={`text-sm font-black ${colorClass} mr-2`}>{val}</span>
        </div>
      );

      const hasData = kpis && kpis.total > 0;
      const ratio = hasData ? Math.round(kpis.paidRatioCount * 100) : 0;
      const isBlocked = ratio < 85;

      return (
        <aside className="w-[380px] flex-shrink-0 bg-white border-r border-gw-line flex flex-col h-screen sticky top-0 shadow-2xl z-20 overflow-y-auto">
          <div className="p-6 pb-5 border-b-2 border-gw-line bg-gw-bg/30">
            <div className="flex items-center gap-2 mb-3">
               <div className="bg-gw-text text-white px-3 py-1.5 rounded-md text-[10px] uppercase font-black tracking-widest shadow-md flex items-center gap-2 border border-gw-text">
                 <div className="h-2 w-2 bg-gw-teal rounded-full animate-pulse"></div>
                 Active Sheet
               </div>
            </div>
            <div className="text-xl font-black text-gw-text truncate leading-tight drop-shadow-sm px-1">{currentSheet || "No Sheet Selected"}</div>
            {fileName && (
               <div className="flex items-center gap-2 mt-3 p-2 bg-white rounded border border-gw-line text-[10px] text-gw-teal2 font-bold uppercase tracking-wider shadow-sm">
                 <i data-lucide="file-spreadsheet" className="w-4 h-4 text-gw-teal"></i>
                 <span className="truncate max-w-[260px]">{fileName}</span>
               </div>
            )}
          </div>

          {hasData && (
            <div className="px-5 mt-6 animate-in">
              <div className="mb-3">
                 <div className="inline-flex items-center gap-2 bg-gw-text text-white px-3 py-1.5 rounded-md shadow-md border border-gw-text">
                   <i data-lucide="settings" className="w-3 h-3 text-gw-teal"></i>
                   <span className="text-[10px] font-black uppercase tracking-wide">WPS Summary</span>
                 </div>
              </div>
              <SummaryCard label="Total Employees" val={kpis.total} borderColor="border-gw-text" />
              <SummaryCard label="Not Covered" val={kpis.uncoveredCount} colorClass="text-orange-600" borderColor="border-orange-400" />
              <SummaryCard label="Covered (Eligible)" val={kpis.eligibleCount} colorClass="text-blue-600" borderColor="border-blue-400" />
              <SummaryCard label="Meeting WPS" val={kpis.paidComplianceCount} colorClass="text-gw-ok" borderColor="border-gw-ok" />
            </div>
          )}

          {hasData && (
            <div className="px-5 mt-4 animate-in">
              <div className="bg-white border border-gw-line rounded-xl p-4 shadow-sm grid grid-cols-2 gap-4 relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-yellow-500 to-gw-danger"></div>
                <div className="flex flex-col gap-2">
                   <div className="bg-gw-text text-white px-2 py-1 rounded text-[10px] font-black uppercase tracking-wide shadow-sm w-fit border border-gw-text">Count Ratio</div>
                   <div className="relative h-12 w-full rounded-lg overflow-hidden bg-gw-line shadow-inner border border-gw-line">
                      <div className="absolute inset-0 bg-gradient-to-r from-yellow-500 to-amber-600 flex items-center justify-center text-white font-black text-xl shadow" style={{ width: '100%' }}>{ratio}%</div>
                   </div>
                </div>
                <div className="flex flex-col gap-2">
                   <div className="bg-gw-text text-white px-2 py-1 rounded text-[10px] font-black uppercase tracking-wide shadow-sm w-fit border border-gw-text">WPS Status</div>
                   <div className={`h-12 w-full rounded-lg flex items-center justify-center font-black text-white shadow-md text-sm border-2 border-white ring-2 ring-opacity-50 ${isBlocked ? 'bg-gw-danger ring-gw-danger' : 'bg-[#1e5832] ring-[#1e5832]'}`}>{isBlocked ? 'BLOCKED' : 'NOT BLOCKED'}</div>
                </div>
              </div>
            </div>
          )}

          {hasData && (
            <div className="px-5 mt-4 mb-6 animate-in">
               <div className="bg-gradient-to-br from-white to-gw-bg border-2 border-gw-line rounded-xl p-5 shadow-lg relative overflow-hidden group hover:border-gw-text transition-all">
                  <div className="mb-4">
                    <div className="bg-gw-text text-white px-3 py-1.5 rounded-md text-[10px] font-black uppercase tracking-wider shadow-md inline-flex items-center gap-2 border border-gw-text">REQUIRED COUNT FOR 85% <i data-lucide="info" className="w-3 h-3 text-gw-teal"></i></div>
                  </div>
                  <div className="flex items-baseline gap-1">
                    <div className="text-6xl font-black text-gw-text tracking-tighter drop-shadow-sm">{kpis.complianceShortfall}</div>
                  </div>
                  <div className="mt-2 text-[11px] text-gw-muted font-bold uppercase tracking-tight border-t border-gw-line pt-2">Employees needed for compliance.</div>
               </div>
            </div>
          )}

          <div className="flex-1 min-h-[20px]"></div>

          <div className="bg-gw-panel border-t-2 border-gw-line p-5">
            <div className="flex items-center justify-between mb-4 cursor-pointer group" onClick={() => setShowControls(!showControls)}>
              <div className="bg-gw-text text-white px-3 py-1.5 rounded-md shadow-md flex items-center gap-2 group-hover:bg-gw-text/90 transition-colors border border-gw-text">
                <i data-lucide="settings" className="w-3.5 h-3.5 text-gw-teal"></i>
                <span className="text-xs font-black uppercase tracking-wide">Data Controls</span>
              </div>
              <div className="text-[10px] font-bold text-gw-muted bg-white px-2 py-0.5 rounded border border-gw-line shadow-sm">{showControls ? 'Hide' : 'Show'}</div>
            </div>

            {showControls && (
              <div className="animate-in">
                <div className="bg-white border-2 border-gw-line rounded-xl p-3 shadow-sm mb-3 hover:border-gw-text transition-colors">
                  <input type="file" accept=".xlsx,.xls" ref={fileInputRef} onChange={(e) => e.target.files[0] && onFileUpload(e.target.files[0])} className="hidden" />
                  <button onClick={() => fileInputRef.current.click()} disabled={isProcessing} className="w-full bg-gw-text hover:bg-black text-white font-black py-3 px-4 rounded-lg transition-all shadow-md flex items-center justify-center gap-2 text-xs uppercase tracking-wide">
                    {isProcessing ? <i data-lucide="refresh-cw" className="animate-spin w-4 h-4"></i> : <i data-lucide="upload-cloud" className="w-4 h-4"></i>}
                    {hasData ? 'Upload New File' : 'Upload XLSX File'}
                  </button>
                </div>
                <div className="bg-white border-2 border-gw-line rounded-xl p-3 shadow-sm mb-3 hover:border-gw-text transition-colors">
                  <select value={currentSheet} onChange={(e) => onSheetChange(e.target.value)} disabled={sheetNames.length === 0} className="w-full bg-gw-bg border border-gw-line text-gw-text font-bold rounded-lg p-2 text-xs focus:outline-none mb-2 cursor-pointer">
                    {sheetNames.length === 0 && <option>Waiting for file...</option>}
                    {sheetNames.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                  <button onClick={onDownloadFull} disabled={!currentSheet} className="w-full border-2 border-gw-line hover:bg-gw-bg text-gw-text hover:text-gw-teal hover:border-gw-teal py-2 rounded-lg text-[10px] font-black transition-all flex items-center justify-center gap-2 uppercase tracking-wide">
                    <i data-lucide="download" className="w-3 h-3"></i> Download Full Cleaned
                  </button>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <button onClick={onDownloadPaid} disabled={!currentSheet} className="bg-white border-2 border-gw-line hover:bg-gw-text hover:text-white text-gw-text py-2 rounded-xl text-[10px] font-black transition-all flex flex-col items-center gap-1 uppercase tracking-tight shadow-sm">
                    <i data-lucide="download" className="w-3.5 h-3.5"></i> Paid List
                  </button>
                  <button onClick={onDownloadDue} disabled={!currentSheet} className="bg-white border-2 border-gw-line hover:bg-gw-danger hover:text-white text-gw-text py-2 rounded-xl text-[10px] font-black transition-all flex flex-col items-center gap-1 uppercase tracking-tight shadow-sm">
                    <i data-lucide="download" className="w-3.5 h-3.5"></i> Need To Pay
                  </button>
                </div>
              </div>
            )}
          </div>
        </aside>
      );
    };

    // 2. KPI Grid Component
    const KPIGrid = ({ kpis }) => {
      const formatMoney = (n) => n.toLocaleString(undefined, { maximumFractionDigits: 2, style: 'currency', currency: 'AED' });
      const formatPct = (n) => (n * 100).toFixed(1) + "%";

      const KPICard = ({ label, value, isMoney = false, tooltip, accentColor = "border-gw-text" }) => (
        <div className={`bg-white border border-gw-line rounded-xl p-5 shadow-sm flex flex-col justify-center relative group cursor-help transition-all hover:-translate-y-1 hover:shadow-xl border-t-4 ${accentColor}`} title={tooltip}>
          <div className="flex items-center justify-between mb-3">
            <div className="text-[10px] font-black uppercase tracking-wider text-gw-muted group-hover:text-gw-text transition-colors">{label}</div>
            <i data-lucide="info" className="w-3 h-3 text-gw-line group-hover:text-gw-teal transition-colors"></i>
          </div>
          <div className={`text-2xl font-black tracking-tighter truncate ${isMoney ? 'text-gw-teal2' : 'text-gw-text'}`}>{value}</div>
        </div>
      );

      return (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
          <KPICard label="Total Records" value={kpis.total} accentColor="border-blue-500" />
          <KPICard label="Paid Count" value={kpis.paidCount} accentColor="border-gw-ok" />
          <KPICard label="Need To Pay Count" value={kpis.dueCount} accentColor="border-gw-danger" />
          <KPICard label="Paid Ratio" value={formatPct(kpis.paidRatioCount)} accentColor="border-yellow-500" />
          <KPICard label="Paid Total" value={formatMoney(kpis.paidTotal)} isMoney accentColor="border-gw-ok" />
          <KPICard label="Contract Total" value={formatMoney(kpis.contractTotal)} isMoney accentColor="border-blue-800" />
          <KPICard label="Outstanding Total" value={formatMoney(kpis.outstandingTotal)} isMoney accentColor="border-gw-danger" />
          <KPICard label="Shortfall (Count)" value={kpis.complianceShortfall} accentColor="border-gw-text" />
        </div>
      );
    };

    // 3. Charts Component
    const ChartsSection = ({ paidCount, dueCount, paidAmount, outstandingAmount }) => {
      const COLORS_COUNT = ['#0d9488', '#dc2626'];
      const COLORS_AMOUNT = ['#2563eb', '#dc2626'];

      const ChartContainer = ({ title, children, accentColor }) => (
        <div className={`bg-white border border-gw-line rounded-2xl p-0 shadow-sm flex flex-col overflow-hidden border-t-4 ${accentColor}`}>
           <div className="px-5 py-4 border-b border-gw-line bg-gw-bg/50">
              <div className="font-black text-sm text-gw-text uppercase tracking-wider">{title}</div>
           </div>
           <div className="h-64 w-full mt-4 pr-4">{children}</div>
        </div>
      );

      const dataCount = [{ name: 'Paid', value: paidCount }, { name: 'Need To Pay', value: dueCount }];
      const dataAmount = [{ name: 'Paid', value: Math.round(paidAmount) }, { name: 'Outstanding', value: Math.round(outstandingAmount) }];

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
          <ChartContainer title="Paid vs Need To Pay (Count)" accentColor="border-gw-teal">
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={dataCount} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value" stroke="none">
                  {dataCount.map((entry, index) => <Cell key={`cell-${index}`} fill={COLORS_COUNT[index % COLORS_COUNT.length]} />)}
                </Pie>
                <Tooltip />
                <Legend verticalAlign="bottom" height={36} iconType="circle" />
              </PieChart>
            </ResponsiveContainer>
          </ChartContainer>
          <ChartContainer title="Paid vs Outstanding (Amount)" accentColor="border-blue-600">
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={dataAmount} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value" stroke="none">
                  {dataAmount.map((entry, index) => <Cell key={`cell-${index}`} fill={COLORS_AMOUNT[index % COLORS_AMOUNT.length]} />)}
                </Pie>
                <Tooltip />
                <Legend verticalAlign="bottom" height={36} iconType="circle" />
              </PieChart>
            </ResponsiveContainer>
          </ChartContainer>
        </div>
      );
    };

    // 4. Remarks Breakdown
    const RemarksGrid = ({ rows, counts, sheetName, onDownload }) => {
      const Card = ({ label, count, isOther, idx }) => {
        const colors = ['border-blue-500', 'border-purple-500', 'border-pink-500', 'border-indigo-500', 'border-cyan-500', 'border-teal-500', 'border-emerald-500', 'border-lime-500', 'border-amber-500', 'border-orange-500'];
        const accentColor = isOther ? 'border-gray-600' : colors[idx % colors.length];

        return (
          <div className={`relative group p-4 rounded-xl border-2 flex flex-col justify-between min-h-[160px] transition-all bg-white hover:border-gw-text hover:shadow-xl hover:-translate-y-1 ${isOther ? 'border-gw-line bg-gw-bg' : 'border-gw-line'}`}>
            <div>
              <div className={`text-[10px] font-black text-gw-text mb-3 min-h-[40px] line-clamp-2 uppercase tracking-tight leading-4 bg-gw-panel rounded-md px-2 py-2 shadow-sm border-l-4 ${accentColor}`}>
                {label}
              </div>
              <div className="text-4xl font-black text-gw-text pl-1">{count}</div>
            </div>
            <button onClick={() => onDownload(label)} disabled={count === 0} className={`mt-4 flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-[10px] font-black w-full border-2 transition-colors uppercase tracking-wide ${count === 0 ? 'opacity-40 cursor-not-allowed text-gw-muted border-transparent bg-gw-bg' : 'hover:bg-gw-text hover:text-white hover:border-gw-text text-gw-text border-gw-line cursor-pointer bg-white shadow-sm'}`}>
              <i data-lucide="download" className="w-3 h-3"></i> XLSX
            </button>
          </div>
        );
      };

      return (
        <div className="bg-white border border-gw-line rounded-2xl p-6 shadow-sm mb-8">
          <div className="flex items-center gap-2 mb-6 pb-2 border-b-2 border-gw-line">
             <div className="h-6 w-1.5 bg-gw-teal rounded-full"></div>
             <div className="font-black text-sm text-gw-text uppercase tracking-wide">Remarks Breakdown</div>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
            {REMARK_MASTER.map((label, i) => <Card key={label} label={label} count={counts[label] || 0} isOther={false} idx={i} />)}
            <Card label={OTHER_REMARK_KEY} count={counts[OTHER_REMARK_KEY] || 0} isOther={true} idx={99} />
          </div>
        </div>
      );
    };

    // 5. Preview Table
    const PreviewTable = ({ title, rows }) => (
      <div className="bg-white border-2 border-gw-line rounded-2xl overflow-hidden shadow-md flex flex-col h-[450px]">
        <div className="px-5 py-4 border-b-2 border-gw-line bg-white z-10 sticky top-0 flex justify-between items-center">
          <span className="font-black text-sm text-gw-text uppercase tracking-wide border-l-4 border-gw-teal pl-3">{title}</span>
          <span className="text-xs font-bold text-white bg-gw-text px-3 py-1.5 rounded-full shadow-sm">{rows.length} rows</span>
        </div>
        <div className="overflow-auto flex-1">
          <table className="w-full text-left border-collapse">
            <thead className="bg-gw-text sticky top-0 z-0 shadow-lg">
              <tr>
                <th className="p-4 text-xs font-black uppercase tracking-wider text-white border-r border-white/10">SNO</th>
                <th className="p-4 text-xs font-black uppercase tracking-wider text-white border-r border-white/10">Name</th>
                <th className="p-4 text-xs font-black uppercase tracking-wider text-white border-r border-white/10">Code</th>
                <th className="p-4 text-xs font-black uppercase tracking-wider text-white text-right border-r border-white/10">Paid</th>
                <th className="p-4 text-xs font-black uppercase tracking-wider text-white text-right border-r border-white/10">Contract</th>
                <th className="p-4 text-xs font-black uppercase tracking-wider text-white">Remark</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-gw-line text-xs text-gw-text font-bold">
              {rows.length === 0 ? <tr><td colSpan={6} className="p-8 text-center text-gw-muted italic">No records found.</td></tr> :
                rows.slice(0, 100).map((r, i) => (
                  <tr key={i} className="hover:bg-gw-panel transition-colors even:bg-slate-50">
                    <td className="p-3 pl-4 text-gw-muted font-mono">{r.sno}</td>
                    <td className="p-3 max-w-[150px] truncate">{r.name}</td>
                    <td className="p-3 font-mono text-gw-teal2">{r.code}</td>
                    <td className={`p-3 text-right ${r.paid > 0 ? 'text-gw-ok' : 'text-gw-muted'}`}>{r.paid > 0 ? r.paid.toLocaleString() : '-'}</td>
                    <td className="p-3 text-right">{r.contract > 0 ? r.contract.toLocaleString() : '-'}</td>
                    <td className="p-3 max-w-[200px] truncate text-gw-text/80">{r.remark}</td>
                  </tr>
                ))
              }
            </tbody>
          </table>
        </div>
      </div>
    );

    /** --- MAIN APP COMPONENT --- **/
    const App = () => {
      const [workbookData, setWorkbookData] = useState(null);
      const [currentSheet, setCurrentSheet] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      const [activeTab, setActiveTab] = useState('paid');
      const [data, setData] = useState({ rows: [], kpis: { total: 0 }, remarkCounts: {} });

      useEffect(() => {
        lucide.createIcons();
      }, [workbookData, currentSheet, data, activeTab]);

      const handleFileUpload = (file) => {
        setIsProcessing(true);
        const reader = new FileReader();
        reader.onload = (e) => {
          const ab = e.target.result;
          const workbook = XLSX.read(ab);
          const sheetNames = workbook.SheetNames;
          setWorkbookData({ fileName: file.name, sheetNames, workbook });
          if (sheetNames.length > 0) processSheetData(workbook, sheetNames[0]);
          setIsProcessing(false);
        };
        reader.readAsArrayBuffer(file);
      };

      const processSheetData = (workbook, sheetName) => {
        const sheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        const map = {};
        let curSno = "";

        for (let i = 1; i < rows.length; i++) {
          const r = rows[i] || [];
          const colA = String(r[0] || "").trim();
          if (colA && /^\d+$/.test(colA)) curSno = colA;
          if (!curSno) continue;
          if (!map[curSno]) map[curSno] = { sno: curSno, name: "", code: "", paid: 0, contract: 0, remark: "" };
          
          const rec = map[curSno];
          const colB = String(r[1] || "").trim();
          if (colB) {
            if (/[A-Za-z]/.test(colB)) rec.name = cleanEnglishName(colB);
            else if (/^\d+$/.test(colB)) rec.code = colB;
          }
          const colC = r[2];
          if (typeof colC === 'number' || (colC && !isNaN(parseNum(colC)))) {
             const val = parseNum(colC);
             if (!rec.paid) rec.paid = val; else rec.contract = val;
          }
          const colD = r[3];
          if (colD) rec.remark = normalizeRemark(colD);
        }

        const cleanedRows = Object.values(map);
        calculateDashboard(cleanedRows);
        setCurrentSheet(sheetName);
      };

      const calculateDashboard = (rows) => {
        let pTotal = 0, cTotal = 0, oTotal = 0, pCount = 0, dCount = 0, pNoRemark = 0;
        const remCounts = { [OTHER_REMARK_KEY]: 0 };
        REMARK_MASTER.forEach(m => remCounts[m] = 0);

        rows.forEach(r => {
          pTotal += r.paid; cTotal += r.contract;
          const isPaid = r.contract === 0 ? true : r.paid >= (r.contract * 0.85);
          const hasRem = !!r.remark && r.remark.length > 0;
          if (isPaid) { pCount++; if (!hasRem) pNoRemark++; }
          else {
            if (hasRem) {
               const match = REMARK_MASTER.find(m => m.toLowerCase() === r.remark.toLowerCase());
               const key = match || OTHER_REMARK_KEY;
               remCounts[key]++;
            } else { dCount++; oTotal += Math.max(r.contract - r.paid, 0); }
          }
        });

        const denom = pNoRemark + dCount;
        const shortfall = Math.max(0, Math.ceil(denom * 0.85) - pNoRemark);

        setData({
          rows,
          remarkCounts: remCounts,
          kpis: {
            total: rows.length, paidCount: pCount, dueCount: dCount, paidTotal: pTotal, contractTotal: cTotal, outstandingTotal: oTotal,
            paidRatioCount: denom ? (pNoRemark / denom) : 0, complianceShortfall: shortfall, uncoveredCount: rows.length - denom,
            eligibleCount: denom, paidComplianceCount: pNoRemark
          }
        });
      };

      const classifyRows = useMemo(() => {
        const paid = [], remarks = [], due = [];
        data.rows.forEach(r => {
          const isPaid = r.contract === 0 ? true : r.paid >= (r.contract * 0.85);
          if (isPaid) paid.push(r);
          else if (r.remark) remarks.push(r);
          else due.push(r);
        });
        return { paid, remarks, due };
      }, [data.rows]);

      const downloadList = (rows, name) => {
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, `${name}_${currentSheet}.xlsx`);
      };

      return (
        <div className="flex min-h-screen bg-gw-bg">
          <Sidebar onFileUpload={handleFileUpload} isProcessing={isProcessing} sheetNames={workbookData?.sheetNames || []} currentSheet={currentSheet} onSheetChange={(s) => processSheetData(workbookData.workbook, s)} kpis={data.kpis} fileName={workbookData?.fileName} onDownloadFull={() => downloadList(data.rows, "FULL")} onDownloadPaid={() => downloadList(classifyRows.paid, "PAID")} onDownloadDue={() => downloadList(classifyRows.due, "NEED_TO_PAY")} />
          <main className="flex-1 p-8 overflow-y-auto h-screen">
            <header className="mb-8">
              <h1 className="text-2xl font-black text-gw-text mb-1">{workbookData ? `Dashboard: ${currentSheet}` : 'Welcome to WPS Dashboard'}</h1>
              <p className="text-gw-muted text-sm">{workbookData ? 'Real-time analysis of payment data.' : 'Upload an XLSX file to begin.'}</p>
            </header>

            {workbookData ? (
              <div className="animate-in pb-12">
                <KPIGrid kpis={data.kpis} />
                <ChartsSection paidCount={classifyRows.paid.length} dueCount={classifyRows.due.length} paidAmount={data.kpis.paidTotal} outstandingAmount={data.kpis.outstandingTotal} />
                <RemarksGrid rows={data.rows} counts={data.remarkCounts} sheetName={currentSheet} onDownload={(key) => downloadList(data.rows.filter(r => r.remark.includes(key)), "REMARK")} />

                <div className="mt-8">
                  <div className="flex items-end gap-1 mb-0 px-2">
                    <button onClick={() => setActiveTab('paid')} className={`flex items-center gap-3 px-6 py-4 rounded-t-lg text-sm font-black border-t-4 transition-all relative top-[2px] z-10 ${activeTab === 'paid' ? 'bg-white border-t-gw-teal border-x-2 border-gw-line text-gw-teal2 shadow-md' : 'bg-gw-line/50 text-gw-muted hover:bg-white/60'}`}>
                      <i data-lucide="list-checks" className="w-4 h-4"></i> <span className="uppercase">Paid List</span> <span className={`px-2 py-0.5 rounded text-[10px] ${activeTab === 'paid' ? 'bg-gw-teal text-white' : 'bg-gw-line'}`}>{classifyRows.paid.length}</span>
                    </button>
                    <button onClick={() => setActiveTab('due')} className={`flex items-center gap-3 px-6 py-4 rounded-t-lg text-sm font-black border-t-4 transition-all relative top-[2px] z-10 ${activeTab === 'due' ? 'bg-white border-t-gw-danger border-x-2 border-gw-line text-red-800 shadow-md' : 'bg-gw-line/50 text-gw-muted hover:bg-white/60'}`}>
                      <i data-lucide="alert-circle" className="w-4 h-4"></i> <span className="uppercase">Need To Pay</span> <span className={`px-2 py-0.5 rounded text-[10px] ${activeTab === 'due' ? 'bg-gw-danger text-white' : 'bg-gw-line'}`}>{classifyRows.due.length}</span>
                    </button>
                    <button onClick={() => setActiveTab('remarks')} className={`flex items-center gap-3 px-6 py-4 rounded-t-lg text-sm font-black border-t-4 transition-all relative top-[2px] z-10 ${activeTab === 'remarks' ? 'bg-white border-t-orange-500 border-x-2 border-gw-line text-orange-800 shadow-md' : 'bg-gw-line/50 text-gw-muted hover:bg-white/60'}`}>
                      <i data-lucide="file-x" className="w-4 h-4"></i> <span className="uppercase">Remarks</span> <span className={`px-2 py-0.5 rounded text-[10px] ${activeTab === 'remarks' ? 'bg-orange-500 text-white' : 'bg-gw-line'}`}>{classifyRows.remarks.length}</span>
                    </button>
                  </div>
                  <div className="bg-white border-2 border-gw-line rounded-b-2xl rounded-tr-2xl p-1 shadow-sm relative min-h-[450px] z-20">
                    <div className="absolute top-4 right-4 z-20">
                        <button onClick={() => downloadList(classifyRows[activeTab], activeTab.toUpperCase())} className="bg-gw-teal/10 hover:bg-gw-teal hover:text-white border border-gw-teal/50 text-gw-teal text-xs font-black px-4 py-2 rounded-lg transition-colors flex items-center gap-2 uppercase tracking-wide">
                          <i data-lucide="download" className="w-4 h-4"></i> Download This List
                        </button>
                    </div>
                    <PreviewTable title={`${activeTab.toUpperCase()} PREVIEW`} rows={classifyRows[activeTab]} />
                  </div>
                </div>
              </div>
            ) : (
              <div className="flex flex-col items-center justify-center h-[60vh] text-gw-muted border-4 border-dashed border-gw-line rounded-3xl bg-gw-panel/50">
                <div className="w-20 h-20 bg-white rounded-2xl flex items-center justify-center mb-6 text-gw-teal shadow-xl border border-gw-line"><i data-lucide="file-up" className="w-10 h-10"></i></div>
                <p className="font-black text-2xl text-gw-text mb-2">No Data Loaded</p>
                <p className="text-sm font-bold opacity-60">Upload an Excel file to see results</p>
              </div>
            )}
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
