<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gulf Way | WPS Dashboard</title>
  
  <!-- CSS Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gw: {
              bg: '#f8fafc',
              panel: '#f1f5f9',
              card: '#ffffff',
              line: '#e2e8f0',
              text: '#0f172a',
              muted: '#64748b',
              teal: '#0d9488',
              teal2: '#115e59',
              blue: '#2563eb',
              danger: '#dc2626',
              ok: '#059669',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #f8fafc; color: #0f172a; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; border: 1px solid #ffffff; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .recharts-default-legend { font-weight: 900 !important; text-transform: uppercase !important; font-size: 10px !important; }
    .animate-in { animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
